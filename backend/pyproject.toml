[project]
name = "job-search-platform"
version = "0.1.0"
description = "Local, project-scoped AI job-search platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk==1.2.1",
    "alembic==1.20.0",
    "boto3==1.43.108",
    "fastapi==0.142.2",
    "keyring==25.6.0",
    "mcp==2.3.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "sqlalchemy==2.1.3",
    "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the real local infrastructure or native runtime"]

[tool.job-search-platform.upstream]
hermes = "c8301ea6c9b797184df16a9c5dd462400b264ff4"
career-ops = "c1d0d1f3229daad3f2f5a7a4e46c9b256db51ea7"
minio = "7aac2a2c5b7c882e68c1ce017d8256be2feea27f"
gosu = "6456aaa0f3c854d199d0f037f068eb97515b7513"
