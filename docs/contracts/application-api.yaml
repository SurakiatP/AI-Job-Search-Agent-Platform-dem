openapi: 3.1.0
info:
  title: Job Search Platform Application API
  version: 1.0.0
  description: >-
    Shared REST contract. Owner routes require the local owner session and CSRF token;
    grant callers use project-bound bearer tokens and cannot read original CVs, uploads,
    messages, or other raw inputs. Provider credentials and model selection are never
    accepted by run submission.
servers:
  - url: /api/v1
security:
  - ownerSession: []
tags:
  - name: bootstrap
  - name: projects
  - name: sessions
  - name: jobs
  - name: files
  - name: runs
  - name: approvals
  - name: sharing
  - name: settings
paths:
  /owner/session:
    post:
      tags: [bootstrap]
      description: Restore a valid loopback owner session after page reload. Requires exact configured Origin and Host plus HttpOnly owner cookie; returns the same derived CSRF token without nonce reuse or token rotation.
      security: [{ownerSession: []}]
      responses:
        '200': {description: Current owner session, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerBootstrapView'}}}}
        '401': {description: Missing, expired or revoked owner session}
  /owner/bootstrap:
    post:
      tags: [bootstrap]
      security: []
      summary: Exchange the one-time local launch nonce for an owner session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerBootstrapRequest'}
      responses:
        '200':
          description: Session established; cookie is HttpOnly and SameSite
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerBootstrapView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects:
    get:
      tags: [projects]
      responses:
        '200': {description: Owner projects, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectView'}}}}}
    post:
      tags: [projects]
      requestBody: {$ref: '#/components/requestBodies/ProjectCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectView'}}}}
  /projects/{project_id}:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [projects]
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [projects]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProjectUpdate'}}}
      responses: {'200': {description: Updated}}
    delete:
      tags: [projects]
      responses: {'204': {description: Deleted}}
  /projects/{project_id}/preferences:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [projects]
      responses: {'200': {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesView'}}}}}
    patch:
      tags: [projects]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesUpdate'}}}
      responses: {'200': {description: Updated preferences}}
  /projects/{project_id}/sessions:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [sessions]
      responses: {'200': {description: Sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionView'}}}}}}
    post:
      tags: [sessions]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}
      responses: {'201': {description: Created session}}
  /projects/{project_id}/sessions/{session_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [sessions]
      description: Owner-only rename. Title is trimmed, 1-200 characters.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionUpdate'}}}
      responses:
        '200': {description: Renamed session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [sessions]
      description: Owner-only delete of a session and its messages. Refused with 409 session_has_runs when any run references the session.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Session has runs (code session_has_runs)}
  /projects/{project_id}/sessions/{session_id}/messages:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [sessions]
      responses: {'200': {description: Owner-only message history}}
    post:
      tags: [sessions]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MessageCreate'}}}
      responses: {'202': {description: Accepted conversation message}}
  /projects/{project_id}/jobs:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      responses: {'200': {description: Job revision views}}
    post:
      tags: [jobs]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JobCreate'}}}
      responses: {'201': {description: Created immutable job revision}}
  /projects/{project_id}/job-search:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      description: >-
        Owner-only server-side proxy of Freehire's public job API, Thailand listings only (countries=TH).
        Query: q (max 200), cities (comma list, max 5 x 60), work_mode (remote|hybrid|onsite),
        posted_within_days (1-90), category (slug, max 60), limit (1-20, default 20), offset (0-1000).
        Items carry slug, title, company, location, cities, work_mode, skills (max 8), category, posted_at,
        age_days, stale (upstream reality.class other than fresh), source_url (http/https, utm_* stripped)
        and description_markdown (max 50000). Upstream failure returns 502 job_source_unavailable (retryable).
      security: [{ownerSession: []}]
      responses:
        '200': {description: 'Job search page {items, total, limit, offset}'}
        '502': {description: Upstream job source unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
  /projects/{project_id}/job-search/facets:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      description: Owner-only Thailand facets {total, categories (top 12), cities (top 10)} as [{value, count}].
      security: [{ownerSession: []}]
      responses:
        '200': {description: Job search facets}
        '502': {description: Upstream job source unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
  /projects/{project_id}/jobs/{job_id}/application-status:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [jobs]
      description: Owner-only status recorded for one immutable job revision; defaults to saved.
      security: [{ownerSession: []}]
      responses:
        '200': {description: Owner application status, content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [jobs]
      description: Owner-only saved/applied status update. This records owner history and does not submit an application.
      security: [{ownerSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusUpdate'}}}
      responses:
        '200': {description: Updated application status, content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/documents:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only generated document metadata and latest revision references.
      responses: {'200': {description: Documents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocumentView'}}}}}}
  /projects/{project_id}/documents/{document_id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: document_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [files]
      description: Owner-only immutable document revision metadata.
      responses: {'200': {description: Revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocumentRevisionView'}}}}}}
  /projects/{project_id}/cv:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only CV revision metadata; raw content is never a grant resource.
      responses: {'200': {description: CV revision views}}
    post:
      tags: [files]
      description: Owner-only multipart upload; server validates bytes, type, and size.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses: {'201': {description: Published CV revision metadata}}
  /projects/{project_id}/files/{file_id}/download:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [files]
      security: [{ownerSession: []}, {projectGrant: []}]
      description: >-
        Authenticated binary stream. Owners may read project files. A current
        results:read grant may stream generated artifacts only; raw CVs, uploads,
        chat attachments and source inputs remain owner-only. Revalidate the grant
        during streaming so revocation stops an in-flight transfer. No object key
        or presigned URL is returned.
      responses:
        '200':
          description: Authorized file bytes
          headers:
            Content-Disposition: {schema: {type: string}}
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '403': {description: Grant lacks results:read or file kind is owner-only}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/runs:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [runs]
      description: Owner list, or grant-visible results filtered to permitted result views.
      security: [{ownerSession: []}, {projectGrant: []}]
      responses: {'200': {description: Runs}}
    post:
      tags: [runs]
      description: Submit a project-scoped evaluate_job or draft_documents request.
      security: [{ownerSession: []}, {projectGrant: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '202': {description: Queued or existing idempotent run, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '409': {description: Idempotency key reused with different inputs}
  /projects/{project_id}/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [runs]
      security: [{ownerSession: []}, {projectGrant: []}]
      responses:
        '200': {description: Authorized run result view, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Last-Event-ID
        in: header
        schema: {type: integer, minimum: 0}
    get:
      tags: [runs]
      description: Persisted SSE replay; grant authorization is rechecked before each event.
      security: [{ownerSession: []}, {projectGrant: []}]
      responses: {'200': {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}}
  /projects/{project_id}/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [runs]
      description: Owner requests cancellation; public status changes only after execution stops.
      responses: {'202': {description: Cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}}
  /projects/{project_id}/approvals:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [approvals]
      responses: {'200': {description: Owner-only pending revision-bound approvals}}
    post:
      tags: [approvals]
      description: Owner-only request for a typed protected action; service snapshots the proposed change digest and expiry.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalRequest'}}}
      responses:
        '201': {description: Created approval, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalView'}}}}
  /projects/{project_id}/approvals/{approval_id}/decision:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [approvals]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecision'}}}
      responses: {'200': {description: One-use approval decision applied}}
  /projects/{project_id}/grants:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [sharing]
      responses: {'200': {description: Owner-only grant metadata; token values are never retrievable}}
    post:
      tags: [sharing]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GrantIssueRequest'}}}
      responses: {'201': {description: Token disclosed once, content: {application/json: {schema: {$ref: '#/components/schemas/GrantIssuedView'}}}}}
  /projects/{project_id}/grants/{grant_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: grant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [sharing]
      responses: {'204': {description: Revoked}}
  /providers:
    get:
      tags: [settings]
      description: Owner-only catalog of supported LLM providers (API-key providers, LM Studio and a custom OpenAI-compatible endpoint).
      responses:
        '200': {description: Provider catalog, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderCatalogView'}}}}
  /projects/{project_id}/settings/provider:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [settings]
      responses: {'200': {description: Provider name, model and masked credential status}}
    put:
      tags: [settings]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderSettingsUpdate'}}}
      responses: {'200': {description: Credential stored by secret adapter; secret value is not returned}}
  /projects/{project_id}/settings/provider/models:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    post:
      tags: [settings]
      description: >-
        List models from the provider endpoint. A null credential reuses the stored key only when the stored
        provider and effective base URL match the request, otherwise 409 credential_required. Upstream failure
        is a retryable 502 provider_models_unavailable; invalid base URL is 422 invalid_base_url. Keys are never returned.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderModelsRequest'}}}
      responses:
        '200': {description: Sorted model list (at most 500), content: {application/json: {schema: {$ref: '#/components/schemas/ProviderModelsView'}}}}
        '409': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Unavailable'}
        '502': {$ref: '#/components/responses/Unavailable'}
  /projects/{project_id}/settings/provider/test:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    post:
      tags: [settings]
      description: Bounded test of the saved provider configuration; never accepts or returns a key.
      responses:
        '200': {description: Sanitized connection result, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderConnectionTestView'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/{project_id}/settings/tools:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [settings]
      responses:
        '200': {description: Project tool connector status, content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorSettingsView'}}}}
  /projects/{project_id}/settings/tools/{adapter}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: adapter
        in: path
        required: true
        schema: {type: string, enum: [career_ops]}
    put:
      tags: [settings]
      description: Create a new immutable revision of an allowlisted built-in connector setting.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorUpdate'}}}
      responses:
        '200': {description: Updated connector status, content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorView'}}}}
  /tools:
    get:
      tags: [settings]
      summary: Discover the fixed platform tool catalog
      description: Returns platform operations only; no Project data or provider configuration.
      responses:
        '200': {description: Allowlisted platform tools, content: {application/json: {schema: {$ref: '#/components/schemas/ToolsView'}}}}
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: owner_session
    projectGrant:
      type: http
      scheme: bearer
  parameters:
    project_id:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    ProjectCreate:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}
  responses:
    Unauthorized:
      description: Owner session or grant is missing, expired or revoked
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
    Unavailable:
      description: Provider or secret adapter is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
    NotFound:
      description: Resource is absent or outside the authorized project scope
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [session_id, operation, job_revision_id, output_language, idempotency_key]
      properties:
        session_id: {type: string, format: uuid}
        operation: {type: string, enum: [evaluate_job, draft_documents]}
        cv_revision_id: {type: [string, 'null'], format: uuid}
        job_revision_id: {type: string, format: uuid}
        output_language: {type: string, enum: [th, en]}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        retry_of_id: {type: [string, 'null'], format: uuid, description: New manual retry of a same-project terminal run; original execution never resumes.}
        owner_instructions: {type: [string, 'null'], maxLength: 4000, description: Owner-only instructions captured in immutable run inputs; manual retry retains the original instructions.}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}}
    ProjectView:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
    ProjectUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}}
    PreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        locale: {type: string, enum: [th, en]}
        output_language: {type: string, enum: [th, en]}
        notifications_enabled: {type: boolean}
    PreferencesView:
      type: object
      additionalProperties: false
      required: [project_id, locale, output_language, notifications_enabled, updated_at]
      properties:
        project_id: {type: string, format: uuid}
        locale: {type: string, enum: [th, en]}
        output_language: {type: string, enum: [th, en]}
        notifications_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    SessionCreate:
      type: object
      additionalProperties: false
      properties: {title: {type: string, maxLength: 200, default: New session}}
    SessionUpdate:
      type: object
      additionalProperties: false
      required: [title]
      properties: {title: {type: string, minLength: 1, maxLength: 200}}
    SessionView:
      type: object
      additionalProperties: false
      required: [id, project_id, title, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
    RevisionView:
      type: object
      additionalProperties: false
      required: [id, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    JobRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          properties:
            description: {type: [string, "null"], maxLength: 50000}
            title: {type: string}
            company: {type: [string, 'null']}
            source_url: {type: [string, 'null']}
            application_status: {type: string, enum: [saved, applied], default: saved}
    JobApplicationStatusUpdate:
      type: object
      additionalProperties: false
      required: [application_status]
      properties:
        application_status: {type: string, enum: [saved, applied]}
    JobApplicationStatusView:
      type: object
      additionalProperties: false
      required: [job_revision_id, application_status]
      properties:
        job_revision_id: {type: string, format: uuid}
        application_status: {type: string, enum: [saved, applied]}
    CVRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          properties:
            original_filename: {type: string}
            mime_type: {type: string}
            size_bytes: {type: integer, minimum: 0}
    DocumentView:
      type: object
      additionalProperties: false
      required: [id, document_type, title]
      properties:
        id: {type: string, format: uuid}
        document_type: {type: string, enum: [cv, cover_letter, other]}
        title: {type: string}
        content_markdown: {type: [string, 'null'], minLength: 1, maxLength: 200000}
        output_language: {type: [string, 'null'], enum: [th, en, null]}
        source_run_id: {type: [string, 'null'], format: uuid}
        partial: {type: boolean, default: false}
        latest_revision: {oneOf: [{$ref: '#/components/schemas/RevisionView'}, {type: 'null'}]}
    DocumentRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          required: [document_id]
          properties:
            document_id: {type: string, format: uuid}
            source_cv_revision_id: {type: [string, 'null'], format: uuid}
            source_job_revision_id: {type: [string, 'null'], format: uuid}
            file_id: {type: [string, 'null'], format: uuid}
            content_markdown: {type: [string, 'null'], minLength: 1, maxLength: 200000}
    FileView:
      type: object
      additionalProperties: false
      required: [id, kind, publication_state, display_name, mime_type, size_bytes, checksum_sha256, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [cv_original, job_source, generated_document, chat_attachment]}
        publication_state: {type: string, enum: [pending, published, unavailable]}
        display_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
        checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_at: {type: string, format: date-time}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties: {content: {type: string, minLength: 1, maxLength: 20000}}
    JobCreate:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        company: {type: [string, 'null'], maxLength: 300}
        source_url: {type: [string, 'null'], maxLength: 2048}
