openapi: 3.1.0
info:
  title: Job Search Platform Application API
  version: 1.0.0
  description: >-
    Shared REST contract. Owner routes require the local owner session and CSRF token;
    grant callers use project-bound bearer tokens and cannot read original CVs, uploads,
    messages, or other raw inputs. Provider credentials and model selection are never
    accepted by run submission.
servers:
  - url: /api/v1
security:
  - ownerSession: []
tags:
  - name: bootstrap
  - name: projects
  - name: sessions
  - name: jobs
  - name: files
  - name: runs
  - name: approvals
  - name: sharing
  - name: settings
paths:
  /owner/session:
    post:
      tags: [bootstrap]
      description: Restore a valid loopback owner session after page reload. Requires exact configured Origin and Host plus HttpOnly owner cookie; returns the same derived CSRF token without nonce reuse or token rotation.
      security: [{ownerSession: []}]
      responses:
        '200': {description: Current owner session, content: {application/json: {schema: {$ref: '#/components/schemas/OwnerBootstrapView'}}}}
        '401': {description: Missing, expired or revoked owner session}
  /owner/bootstrap:
    post:
      tags: [bootstrap]
      security: []
      summary: Exchange the one-time local launch nonce for an owner session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerBootstrapRequest'}
      responses:
        '200':
          description: Session established; cookie is HttpOnly and SameSite
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerBootstrapView'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /projects:
    get:
      tags: [projects]
      responses:
        '200': {description: Owner projects, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProjectView'}}}}}
    post:
      tags: [projects]
      requestBody: {$ref: '#/components/requestBodies/ProjectCreate'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectView'}}}}
  /projects/{project_id}:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [projects]
      responses:
        '200': {description: Project, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [projects]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProjectUpdate'}}}
      responses: {'200': {description: Updated}}
    delete:
      tags: [projects]
      responses: {'204': {description: Deleted}}
  /projects/{project_id}/preferences:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [projects]
      responses: {'200': {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesView'}}}}}
    patch:
      tags: [projects]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PreferencesUpdate'}}}
      responses: {'200': {description: Updated preferences}}
  /projects/{project_id}/sessions:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [sessions]
      responses: {'200': {description: Sessions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SessionView'}}}}}}
    post:
      tags: [sessions]
      description: >-
        Owner-only. Creates a session pinned to one CV revision and one job (saved
        revision or inline job, deduplicated by identical description) and starts its
        evaluation run; the response carries evaluation_run_id. 409 session_pair_exists
        carries fields.session_id of the existing session for the same pair.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}
      responses:
        '201': {description: Created session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Duplicate pair (code session_pair_exists)}
  /projects/{project_id}/sessions/{session_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [sessions]
      description: Owner-only session with its CV/job pair details (null fields for legacy unpaired sessions).
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [sessions]
      description: Owner-only rename. Title is trimmed, 1-200 characters.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SessionUpdate'}}}
      responses:
        '200': {description: Renamed session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [sessions]
      description: >-
        Owner-only. A session without runs is deleted for good with its messages (mode deleted).
        A session with run history is hidden instead (mode hidden, removed_at set): runs, events,
        documents and approvals stay, and it disappears from the session list, GET (404) and new runs (404).
        Refused with 409 session_busy while any of its runs is queued, running or waiting_approval.
      responses:
        '200': {description: Result, content: {application/json: {schema: {$ref: '#/components/schemas/SessionDeleteResult'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Session has active runs (code session_busy)}
  /projects/{project_id}/sessions/{session_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [sessions]
      description: >-
        Owner-only. Un-hides a session hidden by DELETE (idempotent on a visible session). 409
        session_pair_exists with fields.session_id when a visible session now holds the same CV/job pair.
      responses:
        '200': {description: Restored session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Pair taken by another session (code session_pair_exists)}
  /projects/{project_id}/sessions/{session_id}/messages:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [sessions]
      responses: {'200': {description: Owner-only message history}}
    post:
      tags: [sessions]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MessageCreate'}}}
      responses: {'202': {description: Accepted conversation message}}
  /projects/{project_id}/jobs:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      responses: {'200': {description: Job revision views}}
    post:
      tags: [jobs]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JobCreate'}}}
      responses: {'201': {description: Created immutable job revision}}
  /projects/{project_id}/jobs/{job_revision_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: job_revision_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [jobs]
      description: >-
        Owner-only soft removal of one saved job revision (revisions are independent rows; no logical job groups them).
        Idempotent: removing an already removed job returns 204. Removed jobs disappear from the job list and the
        application-status routes (404), and new runs for them are refused with 409 job_removed. Existing runs and
        results stay readable (RunView.job_removed is true).
      security: [{ownerSession: []}]
      responses:
        '204': {description: Removed}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/job-search:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      description: >-
        Owner-only server-side proxy of Freehire's public job API, Thailand listings only (countries=TH).
        Query: q (max 200), cities (comma list, max 5 x 60), work_mode (remote|hybrid|onsite),
        posted_within_days (1-90), category (slug, max 60), limit (1-20, default 20), offset (0-1000).
        Items carry slug, title, company, location, cities, work_mode, skills (max 8), category, posted_at,
        age_days, stale (upstream reality.class other than fresh), source_url (http/https, utm_* stripped)
        and description_markdown (max 50000). Upstream failure returns 502 job_source_unavailable (retryable).
      security: [{ownerSession: []}]
      responses:
        '200': {description: 'Job search page {items, total, limit, offset}'}
        '502': {description: Upstream job source unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
  /projects/{project_id}/job-search/match:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      description: >-
        Owner-only "Smart match": the job-search filters (q, cities, work_mode, posted_within_days, category)
        plus cv_revision_id (a live CV revision of this project) and pool (1-100, default 100, upstream page
        size) and offset (0-1000, start of the pool chunk). The pool is scored against the revision's stored
        skill profile (keyword dictionary, no AI) and returned sorted by score descending, ties by recency,
        jobs naming fewer than two recognisable skills (match null) last. Items are job-search items plus
        match {score_percent, matched[], missing[], required_count} or null. Response {items, total, offset, pool}.
        409 cv_profile_missing when the revision has no profile yet (POST the CV's /profile first);
        404 for a foreign or removed CV revision; 502 job_source_unavailable.
      security: [{ownerSession: []}]
      parameters:
        - {name: cv_revision_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: pool, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 100}}
      responses:
        '200': {description: 'Scored pool {items, total, offset, pool}'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: CV has no skill profile yet (code cv_profile_missing), content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
        '502': {description: Upstream job source unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
  /projects/{project_id}/job-search/facets:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [jobs]
      description: Owner-only Thailand facets {total, categories (top 12), cities (top 10)} as [{value, count}].
      security: [{ownerSession: []}]
      responses:
        '200': {description: Job search facets}
        '502': {description: Upstream job source unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}}
  /projects/{project_id}/jobs/{job_id}/application-status:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [jobs]
      description: Owner-only status recorded for one immutable job revision; defaults to saved.
      security: [{ownerSession: []}]
      responses:
        '200': {description: Owner application status, content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [jobs]
      description: Owner-only saved/applied status update. This records owner history and does not submit an application.
      security: [{ownerSession: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusUpdate'}}}
      responses:
        '200': {description: Updated application status, content: {application/json: {schema: {$ref: '#/components/schemas/JobApplicationStatusView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/documents:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only generated document metadata and latest revision references.
      responses: {'200': {description: Documents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocumentView'}}}}}}
  /projects/{project_id}/documents/{document_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: document_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [files]
      description: >-
        Owner-only move of a drafted document to the trash (soft delete, sets trashed_at). Idempotent. Trashed
        documents disappear from the document list and from grant, MCP and A2A results (documents, run result files,
        file downloads and revisions return not found for grants); the owner can still preview them and restore them.
      security: [{ownerSession: []}]
      responses:
        '204': {description: Moved to trash}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/documents/trash:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only trashed documents, newest trashed first, each with trashed_at.
      responses: {'200': {description: Trashed documents, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocumentView'}}}}}}
  /projects/{project_id}/documents/{document_id}/restore:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: document_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [files]
      description: Owner-only restore from the trash. Idempotent, so restoring a document that is not in the trash returns it unchanged.
      security: [{ownerSession: []}]
      responses:
        '200': {description: Restored document, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentView'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/documents/{document_id}/permanent:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: document_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [files]
      description: >-
        Owner-only permanent delete of a trashed document: its revisions, settled approvals that reference them, run
        output links and any stored file no longer referenced elsewhere are removed in one transaction; private objects
        are deleted afterwards on a best-effort basis. Refused with 409 document_not_trashed unless the document is in
        the trash, and with 409 document_in_use while an approval referencing it is pending or approved but not yet applied.
      security: [{ownerSession: []}]
      responses:
        '204': {description: Deleted}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Not in trash (code document_not_trashed) or in use by a pending approval (code document_in_use)}
  /projects/{project_id}/documents/{document_id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: document_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [files]
      description: Owner-only immutable document revision metadata.
      responses: {'200': {description: Revisions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DocumentRevisionView'}}}}}}
    post:
      tags: [files]
      description: >-
        Owner-only manual edit. Queues a non-LLM export_document run that regenerates the
        PDF/DOCX from the supplied Markdown and appends a revision with origin manual.
        The run needs no provider configuration and is invisible to grants, MCP and A2A.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/DocumentEdit'}}}
      responses:
        '202': {description: Queued export run, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '403': {description: Not an owner}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Another draft or export run for the document is queued or running (document_busy), or the document has no published source revision (document_source_unavailable)}
  /projects/{project_id}/cv:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only CV revision metadata; raw content is never a grant resource.
      responses: {'200': {description: CV revision views}}
    post:
      tags: [files]
      description: Owner-only multipart upload; server validates bytes, type, and size.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses: {'201': {description: Published CV revision metadata}}
  /projects/{project_id}/cvs:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [files]
      description: Owner-only list of named CVs (primary first) with latest revision, revision_count and in_use.
      responses: {'200': {description: CVs, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CVView'}}}}}}
    post:
      tags: [files]
      description: Owner-only multipart upload creating a CV. Name defaults to the filename stem; the project's first CV becomes primary.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}, name: {type: string, maxLength: 120}}
      responses: {'201': {description: Created CV, content: {application/json: {schema: {$ref: '#/components/schemas/CVView'}}}}}
  /projects/{project_id}/cvs/{cv_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: cv_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [files]
      description: Owner-only rename and/or make primary (other CVs are demoted).
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CVUpdate'}}}
      responses:
        '200': {description: Updated CV, content: {application/json: {schema: {$ref: '#/components/schemas/CVView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [files]
      description: Owner-only soft delete. Refused 409 cv_in_use when a session references any revision; deleting the primary promotes the newest remaining CV.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: CV in use (code cv_in_use)}
  /projects/{project_id}/cvs/{cv_id}/revisions:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: cv_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [files]
      description: Owner-only multipart upload of a new revision of this CV.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: {file: {type: string, format: binary}}
      responses:
        '201': {description: Published CV revision metadata, content: {application/json: {schema: {$ref: '#/components/schemas/CVRevisionView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/cvs/{cv_id}/profile:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: cv_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [files]
      description: >-
        Owner-only. Queues a non-LLM profile_cv run (no session, job or provider) that parses the latest
        revision in the sandbox and stores only the canonical skill names found (never CV text). Returns the
        run (202; an already active run for the revision is returned again) or 200 {status: ready} when the
        revision already has a profile. profile_cv runs are hidden from the run list, grants, MCP and A2A.
      responses:
        '200': {description: 'Already profiled: {status: ready}'}
        '202': {description: Profile run queued, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/files/{file_id}/download:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: file_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [files]
      security: [{ownerSession: []}, {projectGrant: []}]
      description: >-
        Authenticated binary stream. Owners may read project files. A current
        results:read grant may stream generated artifacts only; raw CVs, uploads,
        chat attachments and source inputs remain owner-only. Revalidate the grant
        during streaming so revocation stops an in-flight transfer. No object key
        or presigned URL is returned.
      responses:
        '200':
          description: Authorized file bytes
          headers:
            Content-Disposition: {schema: {type: string}}
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '403': {description: Grant lacks results:read or file kind is owner-only}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/runs:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [runs]
      description: Owner list, or grant-visible results filtered to permitted result views.
      security: [{ownerSession: []}, {projectGrant: []}]
      responses: {'200': {description: Runs}}
    post:
      tags: [runs]
      description: Submit a project-scoped evaluate_job or draft_documents request.
      security: [{ownerSession: []}, {projectGrant: []}]
      parameters:
        - {name: Idempotency-Key, in: header, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
      responses:
        '202': {description: Queued or existing idempotent run, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '409': {description: Idempotency key reused with different inputs, or the job was removed (code job_removed)}
  /projects/{project_id}/runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [runs]
      security: [{ownerSession: []}, {projectGrant: []}]
      responses:
        '200': {description: Authorized run result view, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: Last-Event-ID
        in: header
        schema: {type: integer, minimum: 0}
    get:
      tags: [runs]
      description: Persisted SSE replay; grant authorization is rechecked before each event.
      security: [{ownerSession: []}, {projectGrant: []}]
      responses: {'200': {description: text/event-stream, content: {text/event-stream: {schema: {type: string}}}}}
  /projects/{project_id}/runs/{run_id}/cancel:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: run_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [runs]
      description: Owner requests cancellation; public status changes only after execution stops.
      responses: {'202': {description: Cancellation requested, content: {application/json: {schema: {$ref: '#/components/schemas/RunView'}}}}}
  /projects/{project_id}/approvals:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [approvals]
      responses: {'200': {description: Owner-only pending revision-bound approvals}}
    post:
      tags: [approvals]
      description: Owner-only request for a typed protected action; service snapshots the proposed change digest and expiry.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalRequest'}}}
      responses:
        '201': {description: Created approval, content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalView'}}}}
  /projects/{project_id}/approvals/{approval_id}/decision:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: approval_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [approvals]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ApprovalDecision'}}}
      responses: {'200': {description: One-use approval decision applied}}
  /projects/{project_id}/grants:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [sharing]
      responses: {'200': {description: Owner-only grant metadata; token values are never retrievable}}
    post:
      tags: [sharing]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/GrantIssueRequest'}}}
      responses: {'201': {description: Token disclosed once, content: {application/json: {schema: {$ref: '#/components/schemas/GrantIssuedView'}}}}}
  /projects/{project_id}/grants/{grant_id}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: grant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [sharing]
      responses: {'204': {description: Revoked}}
  /providers:
    get:
      tags: [settings]
      description: Owner-only catalog of supported LLM providers (API-key providers, LM Studio and a custom OpenAI-compatible endpoint).
      responses:
        '200': {description: Provider catalog, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderCatalogView'}}}}
  /settings/provider:
    get:
      tags: [settings]
      description: Owner-only system-wide AI provider configuration (applies to all projects; grants are rejected).
      responses: {'200': {description: Provider name, model and masked credential status}}
    put:
      tags: [settings]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderSettingsUpdate'}}}
      responses: {'200': {description: Credential stored by secret adapter; secret value is not returned}}
  /settings/provider/models:
    post:
      tags: [settings]
      description: >-
        List models from the provider endpoint. A null credential reuses the stored key only when the stored
        provider and effective base URL match the request, otherwise 409 credential_required. Upstream failure
        is a retryable 502 provider_models_unavailable; invalid base URL is 422 invalid_base_url. Keys are never returned.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProviderModelsRequest'}}}
      responses:
        '200': {description: Sorted model list (at most 500), content: {application/json: {schema: {$ref: '#/components/schemas/ProviderModelsView'}}}}
        '409': {$ref: '#/components/responses/Unavailable'}
        '422': {$ref: '#/components/responses/Unavailable'}
        '502': {$ref: '#/components/responses/Unavailable'}
  /settings/provider/test:
    post:
      tags: [settings]
      description: Bounded test of the saved provider configuration; never accepts or returns a key.
      responses:
        '200': {description: Sanitized connection result, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderConnectionTestView'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /projects/{project_id}/settings/tools:
    parameters: [{$ref: '#/components/parameters/project_id'}]
    get:
      tags: [settings]
      responses:
        '200': {description: Project tool connector status, content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorSettingsView'}}}}
  /projects/{project_id}/settings/tools/{adapter}:
    parameters:
      - {$ref: '#/components/parameters/project_id'}
      - name: adapter
        in: path
        required: true
        schema: {type: string, enum: [career_ops]}
    put:
      tags: [settings]
      description: Create a new immutable revision of an allowlisted built-in connector setting.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorUpdate'}}}
      responses:
        '200': {description: Updated connector status, content: {application/json: {schema: {$ref: '#/components/schemas/ToolConnectorView'}}}}
  /tools:
    get:
      tags: [settings]
      summary: Discover the fixed platform tool catalog
      description: Returns platform operations only; no Project data or provider configuration.
      responses:
        '200': {description: Allowlisted platform tools, content: {application/json: {schema: {$ref: '#/components/schemas/ToolsView'}}}}
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: owner_session
    projectGrant:
      type: http
      scheme: bearer
  parameters:
    project_id:
      name: project_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  requestBodies:
    ProjectCreate:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/ProjectCreate'}}}
  responses:
    Unauthorized:
      description: Owner session or grant is missing, expired or revoked
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
    Unavailable:
      description: Provider or secret adapter is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
    NotFound:
      description: Resource is absent or outside the authorized project scope
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorView'}}}
  schemas:
    RunRequest:
      type: object
      additionalProperties: false
      required: [session_id, operation, output_language, idempotency_key]
      properties:
        session_id: {type: string, format: uuid}
        operation: {type: string, enum: [evaluate_job, draft_documents]}
        cv_revision_id: {type: [string, 'null'], format: uuid}
        cv_id: {type: [string, 'null'], format: uuid, description: Latest revision of this CV; omitted means the primary CV. Ignored for paired sessions except that a conflicting value gives 422 session_pair_mismatch.}
        job_revision_id: {type: [string, 'null'], format: uuid, description: Required unless the session is paired; a paired session fixes the pair and a conflicting id gives 422 session_pair_mismatch.}
        output_language: {type: string, enum: [th, en]}
        idempotency_key: {type: string, minLength: 1, maxLength: 128}
        retry_of_id: {type: [string, 'null'], format: uuid, description: New manual retry of a same-project terminal run; original execution never resumes.}
        owner_instructions: {type: [string, 'null'], maxLength: 4000, description: Owner-only instructions captured in immutable run inputs; manual retry retains the original instructions.}
        document_id: {type: [string, 'null'], format: uuid, description: Owner-only draft_documents revise; the first draft is appended as a new revision of this live document.}
        draft_kind: {type: [string, 'null'], enum: [cover_letter, application_message, null], description: 'Owner-only, draft_documents only (otherwise 422). Forces the first output document_type. On a paired session an existing live document of this kind drafted for the session job receives a new revision instead of a new document.'}
    DocumentEdit:
      type: object
      additionalProperties: false
      required: [content_markdown]
      properties:
        content_markdown: {type: string, minLength: 1, maxLength: 200000}
        format: {type: [string, 'null'], enum: [pdf, docx, null], description: Defaults to the format of the latest revision file, else pdf.}
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}}
    ProjectView:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        created_at: {type: string, format: date-time}
    ProjectUpdate:
      type: object
      additionalProperties: false
      required: [name]
      properties: {name: {type: string, minLength: 1, maxLength: 200}}
    PreferencesUpdate:
      type: object
      additionalProperties: false
      properties:
        locale: {type: string, enum: [th, en]}
        output_language: {type: string, enum: [th, en]}
        notifications_enabled: {type: boolean}
    PreferencesView:
      type: object
      additionalProperties: false
      required: [project_id, locale, output_language, notifications_enabled, updated_at]
      properties:
        project_id: {type: string, format: uuid}
        locale: {type: string, enum: [th, en]}
        output_language: {type: string, enum: [th, en]}
        notifications_enabled: {type: boolean}
        updated_at: {type: string, format: date-time}
    InlineJob:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        company: {type: [string, 'null'], maxLength: 300}
        source_url: {type: [string, 'null'], maxLength: 2048}
        description: {type: string, minLength: 1, maxLength: 50000}
    SessionCreate:
      type: object
      additionalProperties: false
      required: [cv_revision_id]
      description: Exactly one of job_revision_id or job. Title defaults to "job title · company".
      properties:
        title: {type: [string, 'null'], minLength: 1, maxLength: 200}
        cv_revision_id: {type: string, format: uuid}
        job_revision_id: {type: [string, 'null'], format: uuid}
        job: {oneOf: [{$ref: '#/components/schemas/InlineJob'}, {type: 'null'}]}
    SessionUpdate:
      type: object
      additionalProperties: false
      required: [title]
      properties: {title: {type: string, minLength: 1, maxLength: 200}}
    SessionDeleteResult:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode: {type: string, enum: [deleted, hidden]}
    SessionView:
      type: object
      additionalProperties: false
      required: [id, project_id, title, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        title: {type: string}
        created_at: {type: string, format: date-time}
        cv_revision_id: {type: [string, 'null'], format: uuid}
        job_revision_id: {type: [string, 'null'], format: uuid}
        cv_name: {type: [string, 'null']}
        cv_revision: {type: [integer, 'null']}
        job_title: {type: [string, 'null']}
        job_company: {type: [string, 'null']}
        cv_outdated: {type: boolean, default: false}
        cv_file_id: {type: [string, 'null'], format: uuid}
        evaluation_run_id: {type: [string, 'null'], format: uuid, description: Set only on the create response.}
    RevisionView:
      type: object
      additionalProperties: false
      required: [id, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    JobRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          properties:
            description: {type: [string, "null"], maxLength: 50000}
            title: {type: string}
            company: {type: [string, 'null']}
            source_url: {type: [string, 'null']}
            application_status: {type: string, enum: [saved, applied], default: saved}
    JobApplicationStatusUpdate:
      type: object
      additionalProperties: false
      required: [application_status]
      properties:
        application_status: {type: string, enum: [saved, applied]}
    JobApplicationStatusView:
      type: object
      additionalProperties: false
      required: [job_revision_id, application_status]
      properties:
        job_revision_id: {type: string, format: uuid}
        application_status: {type: string, enum: [saved, applied]}
    CVRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          properties:
            original_filename: {type: string}
            mime_type: {type: string}
            size_bytes: {type: integer, minimum: 0}
            file_id: {type: [string, 'null'], format: uuid}
            skill_profile_ready: {type: boolean, default: false}
            skill_count: {type: [integer, 'null'], minimum: 0}
    CVUpdate:
      type: object
      additionalProperties: false
      properties:
        name: {type: [string, 'null'], minLength: 1, maxLength: 120}
        is_primary: {type: [boolean, 'null'], enum: [true, null]}
    CVView:
      type: object
      additionalProperties: false
      required: [id, name, is_primary, created_at, revision_count, in_use]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_primary: {type: boolean}
        created_at: {type: string, format: date-time}
        latest_revision: {oneOf: [{$ref: '#/components/schemas/CVRevisionView'}, {type: 'null'}]}
        revision_count: {type: integer, minimum: 0}
        in_use: {type: boolean}
    DocumentView:
      type: object
      additionalProperties: false
      required: [id, document_type, title]
      properties:
        id: {type: string, format: uuid}
        document_type: {type: string, enum: [cv, cover_letter, application_message, other]}
        title: {type: string}
        content_markdown: {type: [string, 'null'], minLength: 1, maxLength: 200000}
        output_language: {type: [string, 'null'], enum: [th, en, null]}
        source_run_id: {type: [string, 'null'], format: uuid}
        partial: {type: boolean, default: false}
        trashed_at: {type: [string, 'null'], format: date-time}
        latest_revision: {oneOf: [{$ref: '#/components/schemas/RevisionView'}, {type: 'null'}]}
    DocumentRevisionView:
      allOf:
        - {$ref: '#/components/schemas/RevisionView'}
        - type: object
          required: [document_id]
          properties:
            document_id: {type: string, format: uuid}
            source_cv_revision_id: {type: [string, 'null'], format: uuid}
            source_job_revision_id: {type: [string, 'null'], format: uuid}
            file_id: {type: [string, 'null'], format: uuid}
            content_markdown: {type: [string, 'null'], minLength: 1, maxLength: 200000}
            origin: {type: string, enum: [agent, manual], default: agent, description: manual when produced by an owner edit (export_document run).}
    FileView:
      type: object
      additionalProperties: false
      required: [id, kind, publication_state, display_name, mime_type, size_bytes, checksum_sha256, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [cv_original, job_source, generated_document, chat_attachment]}
        publication_state: {type: string, enum: [pending, published, unavailable]}
        display_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer, minimum: 0}
        checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_at: {type: string, format: date-time}
    MessageCreate:
      type: object
      additionalProperties: false
      required: [content]
      properties: {content: {type: string, minLength: 1, maxLength: 20000}}
    JobCreate:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        company: {type: [string, 'null'], maxLength: 300}
        source_url: {type: [string, 'null'], maxLength: 2048}
        description: {type: string, minLength: 1, maxLength: 50000}
    UploadRequest:
      type: object
      additionalProperties: false
      required: [filename, mime_type, size_bytes]
      properties:
        filename: {type: string, minLength: 1, maxLength: 255}
        mime_type: {type: string, minLength: 1, maxLength: 200}
        size_bytes: {type: integer, minimum: 0, maximum: 20971520}
    EvaluationResult:
      type: object
      additionalProperties: false
      required: [report_markdown]
      properties:
        report_markdown: {type: string, minLength: 1, maxLength: 200000}
        score: {type: [number, 'null'], minimum: 1, maximum: 5, description: Career Ops native 1–5 score; absent when not established.}
        skill_coverage: {anyOf: [{$ref: '#/components/schemas/SkillCoverage'}, {type: 'null'}], description: Deterministic keyword coverage computed by the platform, separate from the AI score.}
    SkillCoverage:
      type: object
      additionalProperties: false
      required: [required, matched, missing, ratio, method]
      properties:
        required: {type: array, maxItems: 60, items: {type: string, minLength: 1, maxLength: 80}}
        matched: {type: array, maxItems: 60, items: {type: string, minLength: 1, maxLength: 80}}
        missing: {type: array, maxItems: 60, items: {type: string, minLength: 1, maxLength: 80}}
        ratio: {type: number, minimum: 0, maximum: 1}
        method: {type: string, maxLength: 40}
    RunView:
      type: object
      additionalProperties: false
      required: [id, project_id, operation, status, output_language, result_file_ids, created_at]
      properties:
        job_revision_id: {type: [string, 'null'], format: uuid}
        evaluation_result: {anyOf: [{$ref: '#/components/schemas/EvaluationResult'}, {type: 'null'}]}
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        session_id: {type: [string, 'null'], format: uuid, description: Null only for profile_cv.}
        operation: {type: string, enum: [evaluate_job, draft_documents, export_document, profile_cv]}
        status: {type: string, enum: [queued, running, waiting_approval, completed, failed, cancelled, interrupted]}
        output_language: {type: string, enum: [th, en]}
        result_file_ids: {type: array, items: {type: string, format: uuid}}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        retry_of_id: {type: [string, 'null'], format: uuid}
        job_removed: {type: boolean, default: false}
    RunEventView:
      type: object
      additionalProperties: false
      required: [sequence, event_type, data, created_at]
      properties:
        sequence: {type: integer, minimum: 1}
        event_type: {type: string}
        data: {$ref: '#/components/schemas/RunEventData'}
        created_at: {type: string, format: date-time}
    RunEventData:
      type: object
      additionalProperties: false
      properties:
        approval_id: {type: [string, 'null'], format: uuid}
        step: {type: [string, 'null'], maxLength: 80}
        status: {type: [string, 'null'], enum: [queued, running, waiting_approval, completed, failed, cancelled, interrupted]}
        artifact_ids: {type: array, items: {type: string, format: uuid}}
        message_key: {type: [string, 'null'], maxLength: 120}
        progress_percent: {type: [integer, 'null'], minimum: 0, maximum: 100}
    ApprovalView:
      type: object
      additionalProperties: false
      required: [id, run_id, action, change_digest, expires_at]
      properties:
        decision: {type: [string, 'null'], enum: [approve, reject, null]}
        applied_at: {type: [string, 'null'], format: date-time}
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        action: {type: string, enum: [promote_cv, delete_document_revision, delete_file]}
        revision_id: {type: [string, 'null'], format: uuid}
        expected_cv_revision_id: {type: [string, 'null'], format: uuid}
        target_file_id: {type: [string, 'null'], format: uuid}
        change_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        expires_at: {type: string, format: date-time}
        consumed_at: {type: [string, 'null'], format: date-time}
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [promote_cv, delete_document_revision, delete_file]}
        revision_id: {type: [string, 'null'], format: uuid}
        expected_cv_revision_id: {type: [string, 'null'], format: uuid}
        target_file_id: {type: [string, 'null'], format: uuid}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties: {decision: {type: string, enum: [approve, reject]}}
    OwnerBootstrapRequest:
      type: object
      additionalProperties: false
      required: [nonce]
      properties: {nonce: {type: string, minLength: 32, maxLength: 256}}
    OwnerBootstrapView:
      type: object
      additionalProperties: false
      required: [authenticated, csrf_token, expires_at]
      properties:
        authenticated: {const: true}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    GrantIssueRequest:
      type: object
      additionalProperties: false
      required: [capabilities, expires_at]
      properties:
        capabilities: {type: array, uniqueItems: true, items: {type: string, enum: ['results:read', 'jobs:evaluate', 'documents:draft']}}
        expires_at: {type: string, format: date-time}
    GrantIssuedView:
      type: object
      additionalProperties: false
      required: [id, token, project_id, capabilities, expires_at]
      properties:
        id: {type: string, format: uuid}
        token: {type: string}
        project_id: {type: string, format: uuid}
        capabilities: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
    GrantView:
      type: object
      additionalProperties: false
      required: [id, project_id, capabilities, expires_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        capabilities: {type: array, items: {type: string, enum: ['results:read', 'jobs:evaluate', 'documents:draft']}}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    ProviderSettingsUpdate:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: {type: string, maxLength: 80}
        model: {type: string, maxLength: 160}
        credential: {type: [string, 'null'], writeOnly: true, description: Required unless the provider is key_optional}
        base_url: {type: [string, 'null'], maxLength: 512, description: Required for custom; https, or http only for loopback hosts}
    ProviderCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, label, default_base_url, requires_base_url, local, key_optional]
      properties:
        id: {type: string}
        label: {type: string}
        default_base_url: {type: string}
        requires_base_url: {type: boolean}
        local: {type: boolean}
        key_optional: {type: boolean}
    ProviderCatalogView:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        providers: {type: array, items: {$ref: '#/components/schemas/ProviderCatalogEntry'}}
    ProviderModelsRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, maxLength: 80}
        base_url: {type: [string, 'null'], maxLength: 512}
        credential: {type: [string, 'null'], writeOnly: true}
    ProviderModelView:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: {type: string}
        name: {type: [string, 'null']}
    ProviderModelsView:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models: {type: array, items: {$ref: '#/components/schemas/ProviderModelView'}}
    ProviderSettingsView:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        provider: {type: [string, 'null']}
        provider_label: {type: [string, 'null']}
        base_url: {type: [string, 'null']}
        model: {type: [string, 'null']}
        configured: {type: boolean}
        revision: {type: [integer, 'null'], minimum: 1}
        masked_secret: {type: [string, 'null']}
    ProviderConnectionTestView:
      type: object
      additionalProperties: false
      required: [status, message_key, checked_at, duration_ms]
      properties:
        status: {type: string, enum: [succeeded, failed, unavailable]}
        message_key: {type: string}
        checked_at: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0, maximum: 30000}
    ToolConnectorUpdate:
      type: object
      additionalProperties: false
      required: [enabled]
      properties: {enabled: {type: boolean}}
    ToolConnectorView:
      type: object
      additionalProperties: false
      required: [adapter, enabled, revision, updated_at]
      properties:
        adapter: {type: string, enum: [career_ops]}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    ToolConnectorSettingsView:
      type: object
      additionalProperties: false
      required: [connectors]
      properties:
        connectors: {type: array, items: {$ref: '#/components/schemas/ToolConnectorView'}}
    ToolDescriptor:
      type: object
      additionalProperties: false
      required: [name, description, required_capability]
      properties:
        name: {type: string, enum: [evaluate_job, draft_documents, get_run, cancel_run, list_results]}
        description: {type: string}
        required_capability: {type: string, enum: ['results:read', 'jobs:evaluate', 'documents:draft']}
    ToolsView:
      type: object
      additionalProperties: false
      required: [tools]
      properties:
        tools: {type: array, items: {$ref: '#/components/schemas/ToolDescriptor'}}
    ErrorView:
      type: object
      additionalProperties: false
      required: [code, message_key, retryable, correlation_id]
      properties:
        code: {type: string}
        message_key: {type: string}
        retryable: {type: boolean}
        fields: {type: [object, 'null'], additionalProperties: {type: string}}
        correlation_id: {type: string, format: uuid}
