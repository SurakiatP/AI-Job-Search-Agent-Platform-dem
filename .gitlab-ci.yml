# Deploy follows the platform team's guide (gitlab-ci-dind-deployment-guide): runner tag ai4thai-gpu1,
# automatic deploy on push to main, every value from the file variable ENV_FILE (Settings -> CI/CD -> Variables).
# ENV_FILE: type File, Protected, environment scope production, "Expand variable reference" off. None is stored here.
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

stages:
  - test
  - deploy

services:
  - docker:29.9.2-dind

unit-tests:
  stage: test
  image: python:3.12-slim
  services: []
  tags:
    - ai4thai-gpu1
  script:
    # the slim image has no git; test_pinned_source_validation builds a throwaway repo with it
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
    - pip install --quiet uv==0.12.2
    - uv sync --locked --project backend --all-groups
    - cd backend && uv run --locked pytest tests/unit -q

compose-config:
  stage: test
  image: docker:29.9.2-cli
  services: []
  tags:
    - ai4thai-gpu1
  script:
    - |
      DATA_PATH=/data/x PORT=1 POSTGRES_USER=u POSTGRES_PASSWORD=p MINIO_ROOT_USER=m MINIO_ROOT_PASSWORD=mmmmmmmm \
      MEILI_MASTER_KEY=k LITELLM_MASTER_KEY=k LITELLM_SALT_KEY=k LITELLM_DB_PASSWORD=d \
      OPENROUTER_API_KEY=o docker compose config -q

deploy:
  stage: deploy
  image: docker:29.9.2-cli
  tags:
    - ai4thai-gpu1
  resource_group: production
  variables:
    # Image tag 1.0.0-<pipeline number>, e.g. 1.0.0-1
    IMAGE_TAG: "1.0.0-${CI_PIPELINE_IID}"
  before_script:
    - docker info
    - docker compose version
    - |
      set -eu
      umask 077
      test -s "$ENV_FILE"
      cp "$ENV_FILE" .env
      chmod 600 .env
  script:
    - docker compose --env-file .env -f docker-compose.yml config --quiet
    - docker compose --env-file .env -f docker-compose.yml build --pull
    - docker compose --env-file .env -f docker-compose.yml up -d --remove-orphans
    - docker compose --env-file .env -f docker-compose.yml ps
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://jobsearch.aiforthai.in.th

down:
  stage: deploy
  image: docker:29.9.2-cli
  tags:
    - ai4thai-gpu1
  resource_group: production
  before_script:
    - |
      set -eu
      umask 077
      test -s "$ENV_FILE"
      cp "$ENV_FILE" .env
      chmod 600 .env
  script:
    - docker compose --env-file .env -f docker-compose.yml down
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    action: access

# Creates the test accounts (already verified, no email needed) inside the running app container.
# TEST_USERS: GitLab file variable (Protected, scope production), one account per line: "<email> <password>".
# Passwords need at least 10 characters. Never printed. Run it after the first successful deploy.
create-test-users:
  stage: deploy
  image: docker:29.9.2-cli
  services: []
  tags:
    - ai4thai-gpu1
  resource_group: production
  script:
    - |
      set -eu
      test -s "$TEST_USERS"
      while read -r email password; do
        [ -n "$email" ] || continue
        printf '%s\n' "$password" | docker exec -i jobsearch-web /app/backend/.venv/bin/python /app/scripts/accounts.py create-user --email "$email" || echo "skipped $email (exists or rejected)"
      done < "$TEST_USERS"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    action: access

# Read-only diagnosis: prints container states and the last log lines of every container of this project
# into the job log. Never prints .env or a full `docker inspect` (that would show environment values).
# Set LOG_LINES when running the job to change the number of lines (default 80).
show-logs:
  stage: deploy
  image: docker:29.9.2-cli
  services: []
  tags:
    - ai4thai-gpu1
  variables:
    LOG_LINES: "80"
  script:
    - |
      set -eu
      docker ps -a --filter "name=jobsearch" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
      for c in $(docker ps -a --filter "name=jobsearch" --format '{{.Names}}'); do
        echo "===== $c ====="
        docker inspect --format 'state={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} oom={{.State.OOMKilled}}' "$c"
        docker logs --tail "$LOG_LINES" "$c" 2>&1 || true
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    action: access

# One-off fix: the minio image runs as uid 65532 and cannot write its data folder.
# Changes the owner of ${DATA_PATH}/minio only (agreed with the platform team); nothing else is touched.
# Uses the postgres image the deploy already pulled, so no new image is needed. DATA_PATH is read from ENV_FILE, never printed.
fix-minio-permission:
  stage: deploy
  image: docker:29.9.2-cli
  services: []
  tags:
    - ai4thai-gpu1
  resource_group: production
  script:
    - |
      set -eu
      test -s "$ENV_FILE"
      DATA_PATH=$(grep -m1 '^DATA_PATH=' "$ENV_FILE" | cut -d= -f2- | tr -d "\"'")
      test -n "$DATA_PATH"
      docker run --rm --user 0 --entrypoint chown -v "$DATA_PATH/minio:/data" postgres:17-alpine -R 65532:65532 /data
      docker run --rm --user 0 --entrypoint ls -v "$DATA_PATH/minio:/data" postgres:17-alpine -lnd /data
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  environment:
    name: production
    action: access
