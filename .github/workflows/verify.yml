name: Verify

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: jsp_ci
          POSTGRES_PASSWORD: jsp_ci_throwaway
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jsp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      - name: Install locked backend tools
        run: python -m pip install uv==0.12.2
      - name: Sync locked backend environment
        run: uv sync --locked --project backend --all-groups
      - name: Create throwaway CI database and object-store credentials
        run: |
          install -d -m 0700 "$RUNNER_TEMP/core02-private"
          printf 'jsp_ci' > "$RUNNER_TEMP/core02-private/postgres-user"
          printf 'jsp_ci_throwaway' > "$RUNNER_TEMP/core02-private/postgres-password"
          printf 'jspciaccess' > "$RUNNER_TEMP/core02-private/minio-access-key"
          printf 'jsp_ci_minio_throwaway' > "$RUNNER_TEMP/core02-private/minio-secret-key"
          chmod 0600 "$RUNNER_TEMP"/core02-private/*
          echo "CORE02_PRIVATE_DIR=$RUNNER_TEMP/core02-private" >> "$GITHUB_ENV"
      - name: Start throwaway MinIO
        # Service containers cannot pass `server /data`, so MinIO runs as a plain container.
        run: |
          docker run -d --name jsp-ci-minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=jspciaccess -e MINIO_ROOT_PASSWORD=jsp_ci_minio_throwaway \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:59000/minio/health/ready && exit 0
            sleep 1
          done
          docker logs jsp-ci-minio
          exit 1
      - name: Run backend unit tests
        env:
          CORE02_POSTGRES_PORT: '55432'
        run: uv run --locked --project backend pytest backend/tests -m "not integration" -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/package-lock.json
      - name: Build frontend for the real-stack browser test
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm ci --prefix tests
          npm exec --prefix tests -- playwright install --with-deps chromium
      - name: Run backend integration tests (Postgres + MinIO)
        env:
          CORE02_POSTGRES_PORT: '55432'
          CORE02_MINIO_PORT: '59000'
        # The storage restart proof needs the full local stack from scripts/local_infra.py.
        run: >-
          uv run --locked --project backend pytest backend/tests -m integration -q
          -k "not test_real_postgres_minio_checksum_and_restart_proof"
      - name: Audit locked backend dependencies
        # Audit the hash-pinned lock export; the local project itself is not on PyPI.
        run: |
          uv export --locked --project backend --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/backend-requirements.txt"
          uv run --locked --project backend pip-audit --strict --disable-pip -r "$RUNNER_TEMP/backend-requirements.txt" --format=json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Install locked browser-test dependencies
        run: npm ci --prefix tests
      - name: Audit browser-test dependencies
        run: npm audit --prefix tests --audit-level=high
      - name: Install Chromium for Playwright
        run: npm exec --prefix tests -- playwright install --with-deps chromium
      - name: Run synthetic browser suite
        shell: bash
        run: |
          set -euo pipefail
          npm run dev --prefix frontend -- --host 127.0.0.1 --port 4175 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4175/tests/shell.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/vite.log"
            exit 1
          fi
          JSP_E2E_BASE_URL=http://127.0.0.1:4175 npm test --prefix tests
