# Production deploy on the customer platform. Same shape as 10service/websearch:
# bind mounts under ${DATA_PATH} (no docker volumes), one published port, external network ai4thai_net.
# Every value comes from the GitLab file variable ENV_FILE, copied to .env by the pipeline (README "Deploy on GitLab").
# The folders under ${DATA_PATH} must exist before the first deploy (create_host_path is off on purpose).

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobsearch_platform_core02
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - type: bind
        source: "${DATA_PATH:?DATA_PATH is required}/postgres"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d jobsearch_platform_core02"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - type: bind
        source: "${DATA_PATH}/minio"
        target: /data
        bind:
          create_host_path: false
    networks: [app_net]

  meilisearch:
    image: getmeili/meilisearch:v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      MEILI_DB_PATH: /meili_data/data.ms
    volumes:
      - type: bind
        source: "${DATA_PATH}/meili"
        target: /meili_data
        bind:
          create_host_path: false
    networks: [app_net]

  litellm-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD}
    volumes:
      - type: bind
        source: "${DATA_PATH}/litellm-db"
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks: [app_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: jobsearch-litellm:${IMAGE_TAG:-1.0.0-0}
    build:
      context: ./infra/litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
    networks: [app_net]

  litellm-seed:
    # One-shot on every deploy: adds the ai-analyze model to LiteLLM (idempotent). The app talks to LiteLLM with the master key.
    image: jobsearch-litellm:${IMAGE_TAG:-1.0.0-0}
    restart: "no"
    depends_on:
      litellm:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - umask 077 && printf '%s' "$$LITELLM_MASTER_KEY" > /tmp/master-key && exec python /seed/seed.py /tmp/app-key
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      LITELLM_MASTER_KEY_FILE: /tmp/master-key
      LITELLM_URL: http://litellm:4000
      OPENROUTER_KEY_PRESENT: ${OPENROUTER_API_KEY:+1}
      AI_ANALYZE_UPSTREAM_MODEL: ${AI_ANALYZE_UPSTREAM_MODEL:-openrouter/openai/gpt-6-luna}
    networks: [app_net]

  app:
    image: jobsearch-app:${IMAGE_TAG:-1.0.0-0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobsearch-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      litellm-seed:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:${PORT:?PORT is required}:8000"
    environment:
      # HOME and DATA_PATH are the same path inside and outside the container: the agent runtime hands
      # workspace paths to the host Docker, which must find them at the same location.
      HOME: ${DATA_PATH}/home
      CORE02_PRIVATE_DIR: ${DATA_PATH}/private
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY}
      JSP_POSTGRES_HOST: postgres
      JSP_POSTGRES_PORT: "5432"
      JSP_MINIO_ENDPOINT: http://minio:9000
      MEILI_URL: http://meilisearch:7700
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-https://jobsearch.aiforthai.in.th}
      JSP_ALLOWED_ORIGINS: ${APP_PUBLIC_ORIGIN:-https://jobsearch.aiforthai.in.th}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Thinking effort and model per AI task (empty = default); see .env.example
      AI_REASONING_EVALUATE_JOB: ${AI_REASONING_EVALUATE_JOB:-}
      AI_MODEL_EVALUATE_JOB: ${AI_MODEL_EVALUATE_JOB:-}
      AI_REASONING_DRAFT_DOCUMENTS: ${AI_REASONING_DRAFT_DOCUMENTS:-}
      AI_MODEL_DRAFT_DOCUMENTS: ${AI_MODEL_DRAFT_DOCUMENTS:-}
      AI_REASONING_EXTRACT_EXPERIENCE: ${AI_REASONING_EXTRACT_EXPERIENCE:-}
      AI_MODEL_EXTRACT_EXPERIENCE: ${AI_MODEL_EXTRACT_EXPERIENCE:-}
      AI_REASONING_TAILOR_CV: ${AI_REASONING_TAILOR_CV:-}
      AI_MODEL_TAILOR_CV: ${AI_MODEL_TAILOR_CV:-}
      AI_REASONING_APPLY_PREPARE: ${AI_REASONING_APPLY_PREPARE:-}
      AI_MODEL_APPLY_PREPARE: ${AI_MODEL_APPLY_PREPARE:-}
      AI_REASONING_INTERVIEW_GENERATE: ${AI_REASONING_INTERVIEW_GENERATE:-}
      AI_MODEL_INTERVIEW_GENERATE: ${AI_MODEL_INTERVIEW_GENERATE:-}
      AI_REASONING_INTERVIEW_GRADE: ${AI_REASONING_INTERVIEW_GRADE:-}
      AI_MODEL_INTERVIEW_GRADE: ${AI_MODEL_INTERVIEW_GRADE:-}
      AI_REASONING_INTERVIEW_REPORT: ${AI_REASONING_INTERVIEW_REPORT:-}
      AI_MODEL_INTERVIEW_REPORT: ${AI_MODEL_INTERVIEW_REPORT:-}
    volumes:
      - type: bind
        source: "${DATA_PATH}"
        target: "${DATA_PATH}"
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [app_net, ai4thai_net]

  # Hourly job ingest (ADR-017 uses a systemd timer; this host has none, so a loop does the same).
  # Credentials come from the private files the app container writes at start, so no secret is added here.
  # A failed pass is logged and retried next hour; the database lock keeps it from overlapping a manual ingest-jobs run.
  ingest:
    image: jobsearch-app:${IMAGE_TAG:-1.0.0-0}
    container_name: jobsearch-ingest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - 'while true; do /app/backend/.venv/bin/python /app/scripts/ingest_jobs.py run || echo "ingest pass failed (exit $$?)"; sleep "$${INGEST_INTERVAL_SECONDS:-3600}"; done'
    environment:
      HOME: ${DATA_PATH}/home
      CORE02_PRIVATE_DIR: ${DATA_PATH}/private
      JSP_POSTGRES_HOST: postgres
      JSP_POSTGRES_PORT: "5432"
      MEILI_URL: http://meilisearch:7700
      INGEST_INTERVAL_SECONDS: ${INGEST_INTERVAL_SECONDS:-3600}
    volumes:
      - type: bind
        source: "${DATA_PATH}"
        target: "${DATA_PATH}"
        read_only: true
        bind:
          create_host_path: false
    networks: [app_net, ai4thai_net]

networks:
  app_net:
  ai4thai_net:
    external: true
